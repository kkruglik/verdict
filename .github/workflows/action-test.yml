name: Action Test

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  action-test:
    name: ${{ matrix.csv }}
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    strategy:
      matrix:
        include:
          - csv: fixtures/basic/data.csv
            schema: fixtures/basic/schema_pass.yaml
          - csv: fixtures/benchmarks/sample_10k.csv
            schema: fixtures/basic/schema_pass.yaml
          - csv: fixtures/benchmarks/sample_100k.csv
            schema: fixtures/basic/schema_pass.yaml
          - csv: fixtures/with_dates/data.csv
            schema: fixtures/with_dates/schema_pass.json
          - csv: fixtures/benchmarks/sample_10k_with_dates.csv
            schema: fixtures/with_dates/schema_pass.json
          - csv: fixtures/benchmarks/sample_100k_with_dates.csv
            schema: fixtures/with_dates/schema_pass.json

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: kkruglik/verdict@main
        with:
          csv: ${{ matrix.csv }}
          schema: ${{ matrix.schema }}

  fail-case:
    name: Fail case
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Run fail case
        id: fail_action
        uses: kkruglik/verdict@main
        with:
          csv: fixtures/basic/data.csv
          schema: fixtures/basic/schema_fail.yaml
        continue-on-error: true

      - name: Verify fail case failed
        if: steps.fail_action.outcome != 'failure'
        run: |
          echo "Expected action to fail but it succeeded"
          exit 1
