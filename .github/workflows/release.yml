name: Release

on:
  workflow_run:
    workflows: ["Release-plz"]
    types: [completed]

env:
  CARGO_TERM_COLOR: always

jobs:
  get-tag:
    name: Get latest verdict-cli tag
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Find new verdict-cli tag
        id: tag
        run: |
          TAG=$(git tag --sort=-creatordate | grep '^verdict-cli-v' | head -1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    needs: get-tag
    if: needs.get-tag.outputs.tag != ''
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.get-tag.outputs.tag }}
      - uses: Swatinem/rust-cache@v2

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release -p verdict-cli --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/verdict-cli"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            mv "${src}.exe" "verdict-cli-${{ matrix.target }}.exe"
          else
            mv "$src" "verdict-cli-${{ matrix.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdict-cli-${{ matrix.target }}
          path: verdict-cli-${{ matrix.target }}*

  upload-assets:
    name: Upload assets
    needs: [get-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: verdict-cli-*
          merge-multiple: true

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-tag.outputs.tag }}
          files: artifacts/verdict-cli-*
