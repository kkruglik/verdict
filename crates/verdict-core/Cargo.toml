[package]
name = "verdict-core"
version = "0.1.3"
edition = "2024"
description = "High-performance data validation engine for tabular data"
readme = "README.md"
license = "MIT"
repository = "https://github.com/kkruglik/verdict"
keywords = ["validation", "data-quality", "csv", "tabular"]
categories = ["data-structures", "parser-implementations"]

[dependencies]
regex = "1"
thiserror = "2.0.18"
csv = { version = "1.4.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = []
csv = ["dep:csv"]
json = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "csv_loading"
harness = false
required-features = ["csv"]
