[package]
name = "verdict-core"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1"
thiserror = "2.0.18"
csv = { version = "1.4.0", optional = true }

[features]
default = []
csv = ["dep:csv"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "csv_loading"
harness = false
required-features = ["csv"]
